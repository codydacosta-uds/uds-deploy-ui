name: Test
on:
  pull_request:
  push:
    branches-ignore: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux shell/capture prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof zsh
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tests/test_step_colors.cjs && node tests/test_log_search.cjs && node tests/test_yaml_highlighting.cjs
      - run: node --check src/uds_deploy/web/app.js && node --check src/uds_deploy/web/theme.js
      - run: git diff --check
