[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uds-deploy-ui"
version = "0.1.0a6"
description = "Local, read-only deployment watcher for UDS and Zarf"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Operating System :: POSIX"]

[project.scripts]
uds-watch = "uds_deploy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uds_deploy = ["cli_bootstrap.c", "bootstrap/*", "web/*.html", "web/*.js", "web/*.css", "web/*.png", "web/fonts/*.woff2", "web/fonts/*.txt"]
